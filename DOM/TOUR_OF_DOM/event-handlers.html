<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handler</title>
</head>
<body>
    <h1 id="page-title">Event Handler</h1>
    <button id="btn-update-title">Update title</button>

    <p id="user-info">No User</p>
    <button id="btn-login">Login</button>
    <br>
    <br>

    <!-- handel input text -->
     <p id="name">No name</p>
     <input id="input-name" placeholder="your name" type="text">
     <button id="btn-update">Update</button>

    <script>
        // set one EventListener
       document.getElementById('btn-update')
       .addEventListener('click',function(){
        console.log('update button clicked');
        // set 2 get the text input field
        const inputName = document.getElementById('input-name')
        console.log(inputName);
        const name = inputName.value;
        console.log('name',name)
        //set 3 the name 
         const nameP = document.getElementById('name')
         nameP.innerText = name

        

        
       })

    </script>
    <script src="event-handlers.js"></script>
</body>
</html>
